services:
  user-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rione-users
      POSTGRES_USER: ${USER_SERVICE_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${USER_SERVICE_DB_PASSWORD:-banana}
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/user-service
    restart: unless-stopped
    depends_on:
      user-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      USER_SERVICE_DB_HOST: user-postgres
      USER_SERVICE_DB_PORT: 5432
      USER_SERVICE_DB_NAME: rione-users
      USER_SERVICE_DB_USERNAME: ${USER_SERVICE_DB_USERNAME:-postgres}
      USER_SERVICE_DB_PASSWORD: ${USER_SERVICE_DB_PASSWORD:-banana}
      RIONE_SERVICE_JWT_SECRET: ${RIONE_SERVICE_JWT_SECRET:?Set RIONE_SERVICE_JWT_SECRET}
    ports:
      - "8081:8080"

  social-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rione-social
      POSTGRES_USER: ${SOCIAL_SERVICE_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SOCIAL_SERVICE_DB_PASSWORD:-banana}
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/api-gateway
    restart: unless-stopped
    depends_on:
      - user-service
      - social-service
      - post-service
      - notification-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      RIONE_GATEWAY_ROUTES_USER_SERVICE_URI: http://user-service:8080
      RIONE_GATEWAY_ROUTES_SOCIAL_SERVICE_URI: http://social-service:8080
    ports:
      - "8080:8080"

  post-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/post-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8083:8080"

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/notification-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8084:8080"

  social-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/social-service
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_started
      social-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      USER_SERVICE_BASE_URL: http://user-service:8080
      SOCIAL_SERVICE_DB_HOST: social-postgres
      SOCIAL_SERVICE_DB_PORT: 5432
      SOCIAL_SERVICE_DB_NAME: rione-social
      SOCIAL_SERVICE_DB_USERNAME: ${SOCIAL_SERVICE_DB_USERNAME:-postgres}
      SOCIAL_SERVICE_DB_PASSWORD: ${SOCIAL_SERVICE_DB_PASSWORD:-banana}
      RIONE_SERVICE_JWT_SECRET: ${RIONE_SERVICE_JWT_SECRET:?Set RIONE_SERVICE_JWT_SECRET}
    ports:
      - "8082:8080"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    depends_on:
      - api-gateway
      - user-service
      - social-service
      - post-service
      - notification-service
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      user-postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-banana}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  user_postgres_data:
  social_postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
