openapi: 3.0.3
x-last-modified: 2026-07-09
info:
  title: Rione API Gateway
  version: v0.8.0
  description: Public gateway contract for Rione service routes.
servers:
  - url: http://localhost:8080
    description: Local gateway
tags:
  - name: Users
    description: Proxied user service operations
  - name: Social
    description: Proxied social service operations under the /social prefix
  - name: Posts
    description: Proxied post service operations
  - name: Notifications
    description: Proxied notification service operations
paths:
  /users:
    post:
      tags:
        - Users
      operationId: gatewaySignUp
      summary: Create a user account
      description: Proxies POST /users to the user service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogInResponse'
        '400':
          $ref: '#/components/responses/UserBadRequest'
  /users/login:
    post:
      tags:
        - Users
      operationId: gatewayLogIn
      summary: Log in a user
      description: Proxies POST /users/login to the user service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInRequest'
      responses:
        '200':
          description: User authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/UserBadRequest'
  /users/me:
    get:
      tags:
        - Users
      operationId: gatewayGetCurrentUser
      summary: Get the authenticated user profile
      description: Proxies GET /users/me to the user service.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UserBadRequest'
  /users/me/profile:
    put:
      tags:
        - Users
      operationId: gatewayUpdateCurrentUserProfile
      summary: Update the authenticated user profile
      description: Proxies PUT /users/me/profile to the user service.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: User profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/UserBadRequest'
  /cities:
    get:
      tags:
        - Users
      operationId: gatewayListCities
      summary: List cities with neighborhoods
      description: Anyone can access this endpoint. Proxies GET /cities to the user service and returns the public location catalog used during signup and profile neighborhood selection.
      responses:
        '200':
          description: City catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CityResponse'
    post:
      tags:
        - Users
      operationId: gatewayCreateCity
      summary: Create a city with neighborhoods
      description: Only authenticated administrators can access this endpoint. Proxies POST /cities to the user service and creates platform-managed locations.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: City created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityResponse'
        '403':
          $ref: '#/components/responses/UserBadRequest'
  /cities/{cityId}:
    get:
      tags:
        - Users
      operationId: gatewayGetCity
      summary: Get a city with neighborhoods
      description: Anyone can access this endpoint. Proxies GET /cities/{cityId} to the user service and returns public city and neighborhood names for location selection.
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: City found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityResponse'
    delete:
      tags:
        - Users
      operationId: gatewayRemoveCity
      summary: Remove a city with neighborhoods
      description: Only authenticated administrators can access this endpoint. Proxies DELETE /cities/{cityId} to the user service and rejects removal while users belong to any of the city's neighborhoods.
      security:
        - bearerAuth: []
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: City removed.
        '403':
          $ref: '#/components/responses/UserBadRequest'
  /social/neighbor-requests:
    post:
      tags:
        - Social
      operationId: gatewaySendNeighborRequest
      summary: Send a neighbor request
      description: Proxies POST /social/neighbor-requests to POST /neighbor-requests in the social service.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNeighborRequestRequest'
      responses:
        '201':
          description: Neighbor request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighborRequestResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /social/neighbor-requests/{requestId}/acceptance:
    post:
      tags:
        - Social
      operationId: gatewayAcceptNeighborRequest
      summary: Accept a neighbor request
      description: Proxies the request to the social service after removing the /social prefix.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Neighbor request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighborRequestResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /social/neighbor-requests/{requestId}/rejection:
    post:
      tags:
        - Social
      operationId: gatewayRejectNeighborRequest
      summary: Reject a neighbor request
      description: Proxies the request to the social service after removing the /social prefix.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Neighbor request rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighborRequestResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /social/me/neighbor-requests/sent:
    get:
      tags:
        - Social
      operationId: gatewayGetMySentNeighborRequests
      summary: List my sent neighbor requests
      description: Proxies to GET /me/neighbor-requests/sent in the social service.
      responses:
        '200':
          description: Neighbor requests sent by the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NeighborRequestResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /social/me/neighbor-requests/received:
    get:
      tags:
        - Social
      operationId: gatewayGetMyReceivedNeighborRequests
      summary: List my received neighbor requests
      description: Proxies to GET /me/neighbor-requests/received in the social service.
      responses:
        '200':
          description: Neighbor requests received by the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NeighborRequestResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /social/me/neighborships:
    get:
      tags:
        - Social
      operationId: gatewayGetMyNeighbors
      summary: List my neighbors
      description: Proxies to GET /me/neighborships in the social service.
      responses:
        '200':
          description: Neighbors for the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NeighborResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /social/me/neighborships/{neighborId}:
    delete:
      tags:
        - Social
      operationId: gatewayDeleteMyNeighborship
      summary: Remove one of my neighborships
      description: Proxies to DELETE /me/neighborships/{neighborId} in the social service.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NeighborId'
      responses:
        '204':
          description: Neighborship removed.
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /social/me/blocks:
    get:
      tags:
        - Social
      operationId: gatewayGetMyBlocks
      summary: List users I blocked
      description: Proxies to GET /me/blocks in the social service.
      responses:
        '200':
          description: Blocks created by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /social/me/blocks/{blockedId}:
    put:
      tags:
        - Social
      operationId: gatewayPutMyBlock
      summary: Block a user idempotently
      description: Proxies to PUT /me/blocks/{blockedId} in the social service without a request body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BlockedId'
      responses:
        '200':
          description: Existing block returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResponse'
        '201':
          description: Block created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
    delete:
      tags:
        - Social
      operationId: gatewayDeleteMyBlock
      summary: Unblock a user idempotently
      description: Proxies to DELETE /me/blocks/{blockedId} in the social service without a request body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BlockedId'
      responses:
        '204':
          description: User is unblocked.
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /posts:
    get:
      tags:
        - Posts
      operationId: gatewayListVisiblePosts
      summary: List visible posts
      description: Only authenticated users can access this endpoint. Proxies GET /posts to the post service and returns posts visible to the requester according to ownership, neighborhood, neighborship, block, and post privacy rules.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visible posts for the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
    post:
      tags:
        - Posts
      operationId: gatewayCreatePost
      summary: Create a post
      description: Only authenticated users can access this endpoint. Proxies POST /posts to the post service and creates a post owned by the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
  /me/posts:
    get:
      tags:
        - Posts
      operationId: gatewayListMyPosts
      summary: List posts authored by the authenticated user
      description: Only authenticated users can access this endpoint. Proxies GET /me/posts to the post service and returns posts authored by the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user's posts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
  /users/{authorId}/posts:
    get:
      tags:
        - Posts
      operationId: gatewayListVisiblePostsByAuthor
      summary: List visible posts by author
      description: Only authenticated users can access this endpoint. Proxies GET /users/{authorId}/posts to the post service and returns the author's posts that the requester is authorized to view.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorId'
      responses:
        '200':
          description: Visible posts by the requested author.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
  /users/{authorId}/public-posts:
    get:
      tags:
        - Posts
      operationId: gatewayListPublicPostsByAuthor
      summary: List public posts by author
      description: Only authenticated users can access this endpoint. Proxies GET /users/{authorId}/public-posts to the post service and returns only public posts for the requested author.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorId'
      responses:
        '200':
          description: Public posts by the requested author.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
  /posts/{postId}:
    get:
      tags:
        - Posts
      operationId: gatewayGetPost
      summary: Get a post
      description: Only authenticated users can access this endpoint. Proxies GET /posts/{postId} to the post service and returns the post only when the requester is authorized to view it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Visible post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
        '404':
          $ref: '#/components/responses/PostNotFound'
    patch:
      tags:
        - Posts
      operationId: gatewayUpdatePost
      summary: Update a post
      description: Only authenticated users can access this endpoint. Proxies PATCH /posts/{postId} to the post service. Only the owner of the post can edit it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRequest'
      responses:
        '200':
          description: Updated post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
        '403':
          $ref: '#/components/responses/PostForbidden'
        '404':
          $ref: '#/components/responses/PostNotFound'
    delete:
      tags:
        - Posts
      operationId: gatewayDeletePost
      summary: Delete a post
      description: Only authenticated users can access this endpoint. Proxies DELETE /posts/{postId} to the post service. Only the owner of the post can delete it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: Post deleted.
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
        '403':
          $ref: '#/components/responses/PostForbidden'
        '404':
          $ref: '#/components/responses/PostNotFound'
  /posts/{postId}/comments:
    get:
      tags:
        - Posts
      operationId: gatewayListPostComments
      summary: List comments
      description: Only authenticated users can access this endpoint. Proxies GET /posts/{postId}/comments to the post service and returns comments only when the requester can view the parent post.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Comments on the post.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
        '404':
          $ref: '#/components/responses/PostNotFound'
    post:
      tags:
        - Posts
      operationId: gatewayAddPostComment
      summary: Add a comment
      description: Only authenticated users can access this endpoint. Proxies POST /posts/{postId}/comments to the post service and adds a comment to a visible post.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRequest'
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
        '404':
          $ref: '#/components/responses/PostNotFound'
  /posts/{postId}/comments/{commentId}:
    patch:
      tags:
        - Posts
      operationId: gatewayUpdatePostComment
      summary: Update a comment
      description: Only authenticated users can access this endpoint. Proxies PATCH /posts/{postId}/comments/{commentId} to the post service. Only the owner of the comment can edit it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRequest'
      responses:
        '200':
          description: Updated comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
        '403':
          $ref: '#/components/responses/PostForbidden'
        '404':
          $ref: '#/components/responses/PostNotFound'
    delete:
      tags:
        - Posts
      operationId: gatewayDeletePostComment
      summary: Delete a comment
      description: Only authenticated users can access this endpoint. Proxies DELETE /posts/{postId}/comments/{commentId} to the post service. Only the owner of the comment can delete it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/CommentId'
      responses:
        '204':
          description: Comment deleted.
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
        '403':
          $ref: '#/components/responses/PostForbidden'
        '404':
          $ref: '#/components/responses/PostNotFound'
  /posts/{postId}/reactions:
    get:
      tags:
        - Posts
      operationId: gatewayListPostReactions
      summary: List reactions
      description: Only authenticated users can access this endpoint. Proxies GET /posts/{postId}/reactions to the post service and returns reactions only when the requester can view the parent post.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Reactions on the post.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reaction'
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
        '404':
          $ref: '#/components/responses/PostNotFound'
    post:
      tags:
        - Posts
      operationId: gatewayCreateOrUpdatePostReaction
      summary: Create or update the authenticated user's reaction
      description: Only authenticated users can access this endpoint. Proxies POST /posts/{postId}/reactions to the post service and creates or updates the authenticated user's reaction.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
      responses:
        '200':
          description: Reaction state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
        '404':
          $ref: '#/components/responses/PostNotFound'
    delete:
      tags:
        - Posts
      operationId: gatewayDeletePostReaction
      summary: Remove the authenticated user's reaction
      description: Only authenticated users can access this endpoint. Proxies DELETE /posts/{postId}/reactions to the post service and removes the authenticated user's reaction.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: Reaction removed.
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
        '404':
          $ref: '#/components/responses/PostNotFound'
  /posts/{postId}/reactions/me:
    get:
      tags:
        - Posts
      operationId: gatewayGetMyPostReaction
      summary: Get the authenticated user's reaction
      description: Only authenticated users can access this endpoint. Proxies GET /posts/{postId}/reactions/me to the post service and returns the authenticated user's reaction when present.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Reaction state or null when absent.
          content:
            application/json:
              schema:
                nullable: true
                $ref: '#/components/schemas/Reaction'
        '400':
          $ref: '#/components/responses/PostBadRequest'
        '401':
          $ref: '#/components/responses/PostUnauthorized'
        '404':
          $ref: '#/components/responses/PostNotFound'
  /notifications/me:
    get:
      tags:
        - Notifications
      operationId: gatewayGetMyNotifications
      summary: List my notifications
      description: Only authenticated users can access this endpoint. Proxies GET /notifications/me to the notification service and returns notifications owned by the authenticated recipient, including request identifiers for request notifications and post identifiers for comment/reaction notifications.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notifications for the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/NotificationUnauthorized'
  /notifications/me/{notificationId}/read:
    patch:
      tags:
        - Notifications
      operationId: gatewayMarkMyNotificationRead
      summary: Mark one of my notifications as read
      description: Only authenticated users can access this endpoint. Proxies PATCH /notifications/me/{notificationId}/read to the notification service. Only the recipient of the notification can mark it as read; notifications owned by another user are hidden as not found.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Notification marked as read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          $ref: '#/components/responses/NotificationBadRequest'
        '401':
          $ref: '#/components/responses/NotificationUnauthorized'
        '404':
          $ref: '#/components/responses/NotificationNotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    NeighborId:
      name: neighborId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    BlockedId:
      name: blockedId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RequestId:
      name: requestId
      in: path
      required: true
      description: Neighbor request identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    AuthorId:
      name: authorId
      in: path
      required: true
      description: Post author user identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    PostId:
      name: postId
      in: path
      required: true
      description: Post identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    CommentId:
      name: commentId
      in: path
      required: true
      description: Comment identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: Notification identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    UserBadRequest:
      description: Invalid request or rejected user service rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserErrorResponse'
    SocialBadRequest:
      description: Invalid request or rejected social service rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SocialErrorResponse'
    PostBadRequest:
      description: Invalid request or rejected post service rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PostErrorResponse'
    PostUnauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayErrorResponse'
    PostForbidden:
      description: The authenticated user is not allowed to modify the requested post resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PostErrorResponse'
    PostNotFound:
      description: Post resource is absent or hidden from the authenticated user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PostErrorResponse'
    NotificationBadRequest:
      description: Invalid request or rejected notification service rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotificationUnauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayErrorResponse'
    NotificationNotFound:
      description: Notification not found for the authenticated user.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    SignUpRequest:
      type: object
      required:
        - name
        - surname
        - username
        - mail
        - password
        - neighborhoodId
        - neighborhoodName
        - city
        - country
        - birthDate
      properties:
        name:
          type: string
          example: Mario
        surname:
          type: string
          example: Rossi
        username:
          type: string
          example: mario.rossi
        mail:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          writeOnly: true
        neighborhoodId:
          type: integer
          format: int64
          example: 10
        neighborhoodName:
          type: string
          example: San Lorenzo
        city:
          type: string
          example: Rome
        country:
          type: string
          example: Italy
        birthDate:
          type: string
          format: date-time
          example: "1990-05-10T00:00:00"
        bio:
          type: string
          nullable: true
    LogInRequest:
      type: object
      required:
        - mail
        - password
      properties:
        mail:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          writeOnly: true
    UpdateProfileRequest:
      type: object
      required:
        - name
        - surname
        - username
        - neighborhoodId
        - neighborhoodName
        - city
        - country
        - birthDate
      properties:
        name:
          type: string
          example: Mario
        surname:
          type: string
          example: Rossi
        username:
          type: string
          example: mario.rossi
        neighborhoodId:
          type: integer
          format: int64
          example: 10
        neighborhoodName:
          type: string
          example: San Lorenzo
        city:
          type: string
          example: Rome
        country:
          type: string
          example: Italy
        birthDate:
          type: string
          format: date-time
          example: "1990-05-10T00:00:00"
        bio:
          type: string
          nullable: true
    UserResponse:
      type: object
      required:
        - id
        - name
        - surname
        - username
        - mail
        - neighborhoodId
        - neighborhoodName
        - city
        - country
        - birthDate
        - admin
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        surname:
          type: string
        username:
          type: string
        mail:
          type: string
          format: email
        neighborhoodId:
          type: integer
          format: int64
        neighborhoodName:
          type: string
        city:
          type: string
        country:
          type: string
        birthDate:
          type: string
          format: date-time
        bio:
          type: string
          nullable: true
        admin:
          type: boolean
    LogInResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: JWT bearer token.
        user:
          $ref: '#/components/schemas/UserResponse'
    CityResponse:
      type: object
      required:
        - id
        - name
        - neighborhoods
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        neighborhoods:
          type: array
          items:
            $ref: '#/components/schemas/NeighborhoodResponse'
    NeighborhoodResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    SendNeighborRequestRequest:
      type: object
      required:
        - receiverId
      properties:
        receiverId:
          type: integer
          format: int64
    NeighborRequestResponse:
      type: object
      required:
        - id
        - senderId
        - receiverId
        - date
        - status
      properties:
        id:
          type: integer
          format: int64
        senderId:
          type: integer
          format: int64
        receiverId:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
    NeighborResponse:
      type: object
      required:
        - id
        - userId
        - neighborId
        - date
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        neighborId:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
    BlockResponse:
      type: object
      required:
        - id
        - blockerId
        - blockedId
      properties:
        id:
          type: integer
          format: int64
        blockerId:
          type: integer
          format: int64
        blockedId:
          type: integer
          format: int64
    CreatePostRequest:
      type: object
      required:
        - neighborhoodId
        - content
        - type
        - visibility
      properties:
        neighborhoodId:
          type: integer
          format: int64
        content:
          type: string
        type:
          type: string
          enum:
            - EVENT
            - DISCUSSION
            - WARNING
            - HELP
        visibility:
          type: string
          enum:
            - PUBLIC
            - PRIVATE
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
    ContentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
    ReactionRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - UPVOTE
            - DOWNVOTE
    Post:
      type: object
      properties:
        id:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        neighborhoodId:
          type: integer
          format: int64
        content:
          type: string
        type:
          type: string
        visibility:
          type: string
        place:
          $ref: '#/components/schemas/Place'
        score:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        author:
          nullable: true
          $ref: '#/components/schemas/UserProfile'
    Place:
      type: object
      nullable: true
      properties:
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
    Comment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        postId:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        author:
          nullable: true
          $ref: '#/components/schemas/UserProfile'
    Reaction:
      type: object
      properties:
        postId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        type:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          nullable: true
          $ref: '#/components/schemas/UserProfile'
    UserProfile:
      type: object
      required:
        - id
        - name
        - surname
        - username
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        surname:
          type: string
        username:
          type: string
    NotificationResponse:
      type: object
      required:
        - id
        - recipientId
        - actorId
        - type
        - title
        - message
        - occurredAt
      properties:
        id:
          type: integer
          format: int64
        recipientId:
          type: integer
          format: int64
        actorId:
          type: integer
          format: int64
        requestId:
          type: integer
          format: int64
          nullable: true
          description: Related neighbor request identifier for request notifications.
        postId:
          type: integer
          format: int64
          nullable: true
          description: Related post identifier for post comment and reaction notifications.
        type:
          type: string
          enum:
            - REQUEST_RECEIVED
            - REQUEST_ACCEPTED
            - POST_COMMENT_ADDED
            - POST_REACTION_ADDED
        title:
          type: string
        message:
          type: string
        occurredAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
    UserErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    SocialErrorResponse:
      type: object
      required:
        - message
        - timestamp
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    PostErrorResponse:
      type: object
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    GatewayErrorResponse:
      type: object
      properties:
        error:
          type: string
