openapi: 3.0.3
x-last-modified: 2026-06-17
info:
  title: Rione API Gateway
  version: v0.1.0
  description: Public gateway contract for Rione service routes.
servers:
  - url: http://localhost:8080
    description: Local gateway
tags:
  - name: Users
    description: Proxied user service operations
  - name: Social
    description: Proxied social service operations under the /social prefix
paths:
  /users:
    post:
      tags:
        - Users
      operationId: gatewaySignUp
      summary: Create a user account
      description: Proxies POST /users to the user service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/UserBadRequest'
  /users/login:
    post:
      tags:
        - Users
      operationId: gatewayLogIn
      summary: Log in a user
      description: Proxies POST /users/login to the user service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInRequest'
      responses:
        '200':
          description: User authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/UserBadRequest'
  /users/{userId}:
    get:
      tags:
        - Users
      operationId: gatewayGetUser
      summary: Get a user profile
      description: Proxies GET /users/{userId} to the user service.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User profile found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/UserBadRequest'
  /users/{userId}/profile:
    put:
      tags:
        - Users
      operationId: gatewayUpdateProfile
      summary: Update a user profile
      description: Proxies PUT /users/{userId}/profile to the user service.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: User profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/UserBadRequest'
  /social/neighbor-requests:
    post:
      tags:
        - Social
      operationId: gatewaySendNeighborRequest
      summary: Send a neighbor request
      description: Proxies POST /social/neighbor-requests to POST /neighbor-requests in the social service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNeighborRequestRequest'
      responses:
        '201':
          description: Neighbor request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighborRequestResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /social/neighbor-requests/{requestId}/acceptance:
    post:
      tags:
        - Social
      operationId: gatewayAcceptNeighborRequest
      summary: Accept a neighbor request
      description: Proxies the request to the social service after removing the /social prefix.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Neighbor request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighborRequestResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /social/neighbor-requests/{requestId}/rejection:
    post:
      tags:
        - Social
      operationId: gatewayRejectNeighborRequest
      summary: Reject a neighbor request
      description: Proxies the request to the social service after removing the /social prefix.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Neighbor request rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighborRequestResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /social/neighbor-requests/{requestId}:
    get:
      tags:
        - Social
      operationId: gatewayGetNeighborRequest
      summary: Get a neighbor request
      description: Proxies the request to the social service after removing the /social prefix.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Neighbor request found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighborRequestResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /social/neighborships:
    get:
      tags:
        - Social
      operationId: gatewayGetNeighborships
      summary: List neighborships by follower
      description: Proxies GET /social/neighborships to GET /neighborships in the social service.
      parameters:
        - name: followerId
          in: query
          required: true
          description: Identifier of the follower user.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Neighborships for the follower.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NeighborshipResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
  /social/blocks:
    post:
      tags:
        - Social
      operationId: gatewayBlockUser
      summary: Block a user
      description: Proxies POST /social/blocks to POST /blocks in the social service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockUserRequest'
      responses:
        '201':
          description: Block created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResponse'
        '400':
          $ref: '#/components/responses/SocialBadRequest'
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: User identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    RequestId:
      name: requestId
      in: path
      required: true
      description: Neighbor request identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    UserBadRequest:
      description: Invalid request or rejected user service rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserErrorResponse'
    SocialBadRequest:
      description: Invalid request or rejected social service rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SocialErrorResponse'
  schemas:
    SignUpRequest:
      type: object
      required:
        - name
        - surname
        - username
        - mail
        - password
        - neighborhoodId
        - neighborhoodName
        - city
        - country
        - birthDate
      properties:
        name:
          type: string
          example: Mario
        surname:
          type: string
          example: Rossi
        username:
          type: string
          example: mario.rossi
        mail:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          writeOnly: true
        neighborhoodId:
          type: integer
          format: int64
          example: 10
        neighborhoodName:
          type: string
          example: San Lorenzo
        city:
          type: string
          example: Rome
        country:
          type: string
          example: Italy
        birthDate:
          type: string
          format: date-time
          example: "1990-05-10T00:00:00"
        bio:
          type: string
          nullable: true
    LogInRequest:
      type: object
      required:
        - mail
        - password
      properties:
        mail:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          writeOnly: true
    UpdateProfileRequest:
      type: object
      required:
        - name
        - surname
        - username
        - neighborhoodId
        - neighborhoodName
        - city
        - country
        - birthDate
      properties:
        name:
          type: string
          example: Mario
        surname:
          type: string
          example: Rossi
        username:
          type: string
          example: mario.rossi
        neighborhoodId:
          type: integer
          format: int64
          example: 10
        neighborhoodName:
          type: string
          example: San Lorenzo
        city:
          type: string
          example: Rome
        country:
          type: string
          example: Italy
        birthDate:
          type: string
          format: date-time
          example: "1990-05-10T00:00:00"
        bio:
          type: string
          nullable: true
    UserResponse:
      type: object
      required:
        - id
        - name
        - surname
        - username
        - mail
        - neighborhoodId
        - neighborhoodName
        - city
        - country
        - birthDate
        - admin
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        surname:
          type: string
        username:
          type: string
        mail:
          type: string
          format: email
        neighborhoodId:
          type: integer
          format: int64
        neighborhoodName:
          type: string
        city:
          type: string
        country:
          type: string
        birthDate:
          type: string
          format: date-time
        bio:
          type: string
          nullable: true
        admin:
          type: boolean
    SendNeighborRequestRequest:
      type: object
      required:
        - senderId
        - receiverId
      properties:
        senderId:
          type: integer
          format: int64
        receiverId:
          type: integer
          format: int64
    BlockUserRequest:
      type: object
      required:
        - blockerId
        - blockedId
      properties:
        blockerId:
          type: integer
          format: int64
        blockedId:
          type: integer
          format: int64
    NeighborRequestResponse:
      type: object
      required:
        - id
        - senderId
        - receiverId
        - date
        - status
      properties:
        id:
          type: integer
          format: int64
        senderId:
          type: integer
          format: int64
        receiverId:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
    NeighborshipResponse:
      type: object
      required:
        - id
        - followerId
        - followedId
        - date
      properties:
        id:
          type: integer
          format: int64
        followerId:
          type: integer
          format: int64
        followedId:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
    BlockResponse:
      type: object
      required:
        - id
        - blockerId
        - blockedId
      properties:
        id:
          type: integer
          format: int64
        blockerId:
          type: integer
          format: int64
        blockedId:
          type: integer
          format: int64
    UserErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    SocialErrorResponse:
      type: object
      required:
        - message
        - timestamp
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
