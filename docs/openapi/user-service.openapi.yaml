openapi: 3.0.3
x-last-modified: 2026-06-18
info:
  title: Rione User Service API
  version: v0.3.0
  description: User account, authentication, profile, and city endpoints.
servers:
  - url: http://localhost:8081
    description: Local Docker Compose port
  - url: http://localhost:8080
    description: Service container port
tags:
  - name: Users
    description: User account and profile operations
  - name: Cities
    description: Platform-managed city and neighborhood operations
paths:
  /users:
    post:
      tags:
        - Users
      operationId: signUp
      summary: Create a user account
      description: Creates a registered user with account, neighborhood, and profile information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /users/login:
    post:
      tags:
        - Users
      operationId: logIn
      summary: Log in a user
      description: Authenticates a registered user with email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInRequest'
      responses:
        '200':
          description: User authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /users/{userId}:
    get:
      tags:
        - Users
      operationId: getUser
      summary: Get a user profile
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User profile found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/profile:
    put:
      tags:
        - Users
      operationId: updateProfile
      summary: Update a user profile
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: User profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /cities:
    post:
      tags:
        - Cities
      operationId: createCity
      summary: Insert a city with neighborhoods
      description: Creates a platform-managed city with its neighborhoods. Only admin users can perform this operation.
      parameters:
        - $ref: '#/components/parameters/ActingUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCityRequest'
      responses:
        '201':
          description: City created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cities/{cityId}:
    get:
      tags:
        - Cities
      operationId: getCity
      summary: Get a city with neighborhoods
      parameters:
        - $ref: '#/components/parameters/CityId'
      responses:
        '200':
          description: City found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Cities
      operationId: removeCity
      summary: Remove a city with neighborhoods
      description: Removes a platform-managed city with its neighborhoods. Only admin users can perform this operation, and removal is rejected while users belong to any of the city's neighborhoods.
      parameters:
        - $ref: '#/components/parameters/ActingUserId'
        - $ref: '#/components/parameters/CityId'
      responses:
        '204':
          description: City and neighborhoods removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    ActingUserId:
      name: X-User-Id
      in: header
      required: true
      description: Authenticated acting user identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      description: User identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    CityId:
      name: cityId
      in: path
      required: true
      description: City identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request or rejected domain/application rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SignUpRequest:
      type: object
      required:
        - name
        - surname
        - username
        - mail
        - password
        - neighborhoodId
        - birthDate
        - bio
      properties:
        name:
          type: string
          example: Mario
        surname:
          type: string
          example: Rossi
        username:
          type: string
          example: mario.rossi
        mail:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          writeOnly: true
          example: "correct-horse-battery-staple"
        neighborhoodId:
          type: integer
          format: int64
          example: 10
        birthDate:
          type: string
          format: date-time
          example: "1990-05-10T00:00:00"
        bio:
          type: string
          example: I like local markets and neighborhood events.
    LogInRequest:
      type: object
      required:
        - mail
        - password
      properties:
        mail:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          writeOnly: true
          example: "correct-horse-battery-staple"
    UpdateProfileRequest:
      type: object
      required:
        - name
        - surname
        - username
        - neighborhoodId
        - birthDate
        - bio
      properties:
        name:
          type: string
          example: Mario
        surname:
          type: string
          example: Rossi
        username:
          type: string
          example: mario.rossi
        neighborhoodId:
          type: integer
          format: int64
          example: 10
        birthDate:
          type: string
          format: date-time
          example: "1990-05-10T00:00:00"
        bio:
          type: string
          example: I like local markets and neighborhood events.
    UserResponse:
      type: object
      required:
        - id
        - name
        - surname
        - username
        - mail
        - neighborhoodId
        - birthDate
        - bio
        - admin
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Mario
        surname:
          type: string
          example: Rossi
        username:
          type: string
          example: mario.rossi
        mail:
          type: string
          format: email
          example: mario.rossi@example.com
        neighborhoodId:
          type: integer
          format: int64
          example: 10
        birthDate:
          type: string
          format: date-time
          example: "1990-05-10T00:00:00"
        bio:
          type: string
          example: I like local markets and neighborhood events.
        admin:
          type: boolean
          example: false
    CreateCityRequest:
      type: object
      required:
        - name
        - neighborhoods
      properties:
        name:
          type: string
          maxLength: 120
          example: Rome
        neighborhoods:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 120
          example:
            - San Lorenzo
            - Testaccio
    CityResponse:
      type: object
      required:
        - id
        - name
        - neighborhoods
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Rome
        neighborhoods:
          type: array
          items:
            $ref: '#/components/schemas/NeighborhoodResponse'
    NeighborhoodResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: San Lorenzo
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Invalid request.
