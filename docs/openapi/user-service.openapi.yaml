openapi: 3.0.3
x-last-modified: 2026-06-23
info:
  title: Rione User Service API
  version: v0.5.0
  description: User account, authentication, profile, and city endpoints.
servers:
  - url: http://localhost:8081
    description: Local Docker Compose port
  - url: http://localhost:8080
    description: Service container port
tags:
  - name: Users
    description: User account and profile operations
  - name: Cities
    description: Platform-managed city and neighborhood operations
paths:
  /users:
    post:
      tags:
        - Users
      operationId: signUp
      summary: Create a user account
      description: Creates a registered user with account, neighborhood, and profile information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogInResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /users/login:
    post:
      tags:
        - Users
      operationId: logIn
      summary: Log in a user
      description: Authenticates a registered user with email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInRequest'
      responses:
        '200':
          description: User authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /users/me:
    get:
      tags:
        - Users
      operationId: getCurrentUser
      summary: Get the authenticated user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user profile found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/logout:
    post:
      tags:
        - Users
      operationId: logOut
      summary: Log out the authenticated user
      description: Invalidates the bearer token used for this request for its remaining lifetime.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Access token invalidated.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/profile:
    put:
      tags:
        - Users
      operationId: updateCurrentUserProfile
      summary: Update the authenticated user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Authenticated user profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cities:
    post:
      tags:
        - Cities
      operationId: createCity
      summary: Insert a city with neighborhoods
      description: Creates a platform-managed city with its neighborhoods. Only admin users can perform this operation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCityRequest'
      responses:
        '201':
          description: City created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cities/{cityId}:
    get:
      tags:
        - Cities
      operationId: getCity
      summary: Get a city with neighborhoods
      description: Only admin users can perform this operation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CityId'
      responses:
        '200':
          description: City found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Cities
      operationId: removeCity
      summary: Remove a city with neighborhoods
      description: Removes a platform-managed city with its neighborhoods. Only admin users can perform this operation, and removal is rejected while users belong to any of the city's neighborhoods.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CityId'
      responses:
        '204':
          description: City and neighborhoods removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /internal/users/{userId}/neighborhood:
    get:
      tags:
        - Users
      operationId: getUserNeighborhoodForService
      summary: Resolve a user's neighborhood for an internal service
      description: Internal service-to-service endpoint. Requires a service JWT with ROLE_SERVICE and audience user-service.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Minimal neighborhood membership data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNeighborhoodResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/users/search:
    get:
      tags:
        - Users
      operationId: searchUsersForService
      summary: Search minimal user profiles in a neighborhood
      description: Internal service-to-service endpoint used for neighborhood-scoped social discovery.
      security:
        - bearerAuth: []
      parameters:
        - name: neighborhoodId
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Minimal profiles matching username, name, or surname.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDirectoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: User identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    CityId:
      name: cityId
      in: path
      required: true
      description: City identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request or rejected domain/application rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    UserDirectoryResponse:
      type: object
      required: [id, name, surname, username]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        surname:
          type: string
        username:
          type: string
    UserNeighborhoodResponse:
      type: object
      required:
        - userId
        - neighborhoodId
      properties:
        userId:
          type: integer
          format: int64
          example: 2
        neighborhoodId:
          type: integer
          format: int64
          example: 10
    SignUpRequest:
      type: object
      required:
        - name
        - surname
        - username
        - mail
        - password
        - neighborhoodId
        - birthDate
        - bio
      properties:
        name:
          type: string
          example: Mario
        surname:
          type: string
          example: Rossi
        username:
          type: string
          example: mario.rossi
        mail:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          writeOnly: true
          example: "correct-horse-battery-staple"
        neighborhoodId:
          type: integer
          format: int64
          example: 10
        birthDate:
          type: string
          format: date-time
          example: "1990-05-10T00:00:00"
        bio:
          type: string
          example: I like local markets and neighborhood events.
    LogInRequest:
      type: object
      required:
        - mail
        - password
      properties:
        mail:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          writeOnly: true
          example: "correct-horse-battery-staple"
    LogInResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: JWT bearer token.
        user:
          $ref: '#/components/schemas/UserResponse'
    UpdateProfileRequest:
      type: object
      required:
        - name
        - surname
        - username
        - neighborhoodId
        - birthDate
        - bio
      properties:
        name:
          type: string
          example: Mario
        surname:
          type: string
          example: Rossi
        username:
          type: string
          example: mario.rossi
        neighborhoodId:
          type: integer
          format: int64
          example: 10
        birthDate:
          type: string
          format: date-time
          example: "1990-05-10T00:00:00"
        bio:
          type: string
          example: I like local markets and neighborhood events.
    UserResponse:
      type: object
      required:
        - id
        - name
        - surname
        - username
        - mail
        - neighborhoodId
        - birthDate
        - bio
        - admin
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Mario
        surname:
          type: string
          example: Rossi
        username:
          type: string
          example: mario.rossi
        mail:
          type: string
          format: email
          example: mario.rossi@example.com
        neighborhoodId:
          type: integer
          format: int64
          example: 10
        birthDate:
          type: string
          format: date-time
          example: "1990-05-10T00:00:00"
        bio:
          type: string
          example: I like local markets and neighborhood events.
        admin:
          type: boolean
          example: false
    CreateCityRequest:
      type: object
      required:
        - name
        - neighborhoods
      properties:
        name:
          type: string
          maxLength: 120
          example: Rome
        neighborhoods:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 120
          example:
            - San Lorenzo
            - Testaccio
    CityResponse:
      type: object
      required:
        - id
        - name
        - neighborhoods
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Rome
        neighborhoods:
          type: array
          items:
            $ref: '#/components/schemas/NeighborhoodResponse'
    NeighborhoodResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: San Lorenzo
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Invalid request.
