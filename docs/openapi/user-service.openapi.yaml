openapi: 3.0.3
x-last-modified: 2026-06-17
info:
  title: Rione User Service API
  version: v0.1.0
  description: User account, authentication, profile retrieval, and profile update endpoints.
servers:
  - url: http://localhost:8081
    description: Local Docker Compose port
  - url: http://localhost:8080
    description: Service container port
tags:
  - name: Users
    description: User account and profile operations
paths:
  /users:
    post:
      tags:
        - Users
      operationId: signUp
      summary: Create a user account
      description: Creates a registered user with account, neighborhood, and profile information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /users/login:
    post:
      tags:
        - Users
      operationId: logIn
      summary: Log in a user
      description: Authenticates a registered user with email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInRequest'
      responses:
        '200':
          description: User authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /users/{userId}:
    get:
      tags:
        - Users
      operationId: getUser
      summary: Get a user profile
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User profile found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /users/{userId}/profile:
    put:
      tags:
        - Users
      operationId: updateProfile
      summary: Update a user profile
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: User profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: User identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request or rejected domain/application rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SignUpRequest:
      type: object
      required:
        - name
        - surname
        - username
        - mail
        - password
        - neighborhoodId
        - neighborhoodName
        - city
        - country
        - birthDate
      properties:
        name:
          type: string
          example: Mario
        surname:
          type: string
          example: Rossi
        username:
          type: string
          example: mario.rossi
        mail:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          writeOnly: true
          example: "correct-horse-battery-staple"
        neighborhoodId:
          type: integer
          format: int64
          example: 10
        neighborhoodName:
          type: string
          example: San Lorenzo
        city:
          type: string
          example: Rome
        country:
          type: string
          example: Italy
        birthDate:
          type: string
          format: date-time
          example: "1990-05-10T00:00:00"
        bio:
          type: string
          nullable: true
          example: I like local markets and neighborhood events.
    LogInRequest:
      type: object
      required:
        - mail
        - password
      properties:
        mail:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          writeOnly: true
          example: "correct-horse-battery-staple"
    UpdateProfileRequest:
      type: object
      required:
        - name
        - surname
        - username
        - neighborhoodId
        - neighborhoodName
        - city
        - country
        - birthDate
      properties:
        name:
          type: string
          example: Mario
        surname:
          type: string
          example: Rossi
        username:
          type: string
          example: mario.rossi
        neighborhoodId:
          type: integer
          format: int64
          example: 10
        neighborhoodName:
          type: string
          example: San Lorenzo
        city:
          type: string
          example: Rome
        country:
          type: string
          example: Italy
        birthDate:
          type: string
          format: date-time
          example: "1990-05-10T00:00:00"
        bio:
          type: string
          nullable: true
          example: I like local markets and neighborhood events.
    UserResponse:
      type: object
      required:
        - id
        - name
        - surname
        - username
        - mail
        - neighborhoodId
        - neighborhoodName
        - city
        - country
        - birthDate
        - admin
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Mario
        surname:
          type: string
          example: Rossi
        username:
          type: string
          example: mario.rossi
        mail:
          type: string
          format: email
          example: mario.rossi@example.com
        neighborhoodId:
          type: integer
          format: int64
          example: 10
        neighborhoodName:
          type: string
          example: San Lorenzo
        city:
          type: string
          example: Rome
        country:
          type: string
          example: Italy
        birthDate:
          type: string
          format: date-time
          example: "1990-05-10T00:00:00"
        bio:
          type: string
          nullable: true
          example: I like local markets and neighborhood events.
        admin:
          type: boolean
          example: false
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Invalid request.
