name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Test all microservices
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - services/user-service
          - services/post-service
          - services/social-service
          - services/notification-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit and integration tests
        run: ./mvnw -B -pl ${{ matrix.module }} verify

  build:
    name: Build reactor
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all modules
        run: ./mvnw -B verify

      - name: Upload service artifacts
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: rione-service-jars
          path: services/*/target/*.jar
          if-no-files-found: error
