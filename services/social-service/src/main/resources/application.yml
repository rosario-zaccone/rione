spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: jdbc:postgresql://${SOCIAL_SERVICE_DB_HOST:localhost}:${SOCIAL_SERVICE_DB_PORT:5433}/${SOCIAL_SERVICE_DB_NAME:rione-social}
    username: ${SOCIAL_SERVICE_DB_USERNAME:postgres}
    password: ${SOCIAL_SERVICE_DB_PASSWORD:banana}
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: social-service
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,circuitbreakers,circuitbreakerevents

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      user-service:
        base-config: default

rione:
  security:
    jwt:
      secret: ${RIONE_JWT_SECRET:change-this-demo-secret-key-1234567890}
      service-secret: ${RIONE_SERVICE_JWT_SECRET:change-this-demo-service-secret-key-1234567890}
      expiration-ms: ${RIONE_JWT_EXPIRATION_MS:86400000}
      service-expiration-ms: ${RIONE_SERVICE_JWT_EXPIRATION_MS:300000}
      service-name: social-service
  clients:
    user-service:
      base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}
  messaging:
    social-topic: ${RIONE_SOCIAL_TOPIC:social}
