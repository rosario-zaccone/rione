spring:
  datasource:
    url: jdbc:postgresql://${USER_SERVICE_DB_HOST:localhost}:${USER_SERVICE_DB_PORT:5432}/${USER_SERVICE_DB_NAME:rione-users}
    username: ${USER_SERVICE_DB_USERNAME:rione_user}
    password: ${USER_SERVICE_DB_PASSWORD:rione_password}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: user-service
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,circuitbreakers,circuitbreakerevents

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      user-service:
        base-config: default

rione:
  security:
    jwt:
      secret: ${RIONE_JWT_SECRET:change-this-demo-secret-key-1234567890}
      service-secret: ${RIONE_SERVICE_JWT_SECRET:change-this-demo-service-secret-key-1234567890}
      expiration-ms: ${RIONE_JWT_EXPIRATION_MS:86400000}
